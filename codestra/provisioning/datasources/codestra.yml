apiVersion: 1

deleteDatasources:
  - name: Codestra Prometheus
    orgId: 1
  - name: Codestra Loki
    orgId: 1
  - name: Codestra Tempo
    orgId: 1
  - name: Codestra Alertmanager
    orgId: 1

datasources:
  - name: Codestra Prometheus
    uid: codestra-prometheus
    type: prometheus
    access: proxy
    url: https://prom.codestra.media
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      tlsSkipVerify: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: codestra-tempo

  - name: Codestra Loki
    uid: codestra-loki
    type: loki
    access: proxy
    url: https://loki.codestra.media
    editable: false
    jsonData:
      tlsSkipVerify: false
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id[=:]"?([A-Fa-f0-9]{16,32})'
          datasourceUid: codestra-tempo
          url: '$${__value.raw}'
        - name: CorrelationID
          matcherRegex: 'correlation_id[=:]"?([A-Za-z0-9._:-]+)'
          url: 'https://graf.codestra.media/explore?left=$${__value.raw}'

  - name: Codestra Tempo
    uid: codestra-tempo
    type: tempo
    access: proxy
    url: https://temp.codestra.media
    editable: false
    jsonData:
      tlsSkipVerify: false
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: codestra-prometheus
      tracesToLogsV2:
        datasourceUid: codestra-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: true
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: environment
          - key: codestra.business
            value: codestra_business
      tracesToMetrics:
        datasourceUid: codestra-prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
          - key: deployment.environment
            value: environment

  - name: Codestra Alertmanager
    uid: codestra-alertmanager
    type: alertmanager
    access: proxy
    url: https://aler.codestra.media
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
      tlsSkipVerify: false
