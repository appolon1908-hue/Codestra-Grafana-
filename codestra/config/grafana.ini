app_mode = production
instance_name = codestra-grafana

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = graf.codestra.media
enforce_domain = true
root_url = https://graf.codestra.media/
serve_from_sub_path = false
router_logging = true
enable_gzip = true
read_timeout = 30s

[database]
type = postgres
host = $__env{GF_DATABASE_HOST}
name = $__env{GF_DATABASE_NAME}
user = $__file{/run/secrets/grafana_database_user}
password = $__file{/run/secrets/grafana_database_password}
high_availability = true
max_idle_conn = 10
max_open_conn = 50
conn_max_lifetime = 14400
ssl_mode = verify-full
ca_cert_path = /run/secrets/grafana_database_ca
instrument_queries = true

[remote_cache]
type = database

[dataproxy]
logging = false
timeout = 60
dialTimeout = 10
keep_alive_seconds = 30
tls_handshake_timeout_seconds = 10
max_conns_per_host = 100
max_idle_connections = 100
idle_conn_timeout_seconds = 90

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = dark
default_language = en-US
external_manage_link_url = https://auth.codestra.co/realms/codestra/account/
external_manage_link_name = Codestra Identity
external_manage_info = User access is managed by Codestra Keycloak.

[auth]
disable_login_form = true
disable_signout_menu = false
signout_redirect_url = https://auth.codestra.co/realms/codestra/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgraf.codestra.media%2F
login_maximum_inactive_lifetime_duration = 8h
login_maximum_lifetime_duration = 24h
token_rotation_interval_minutes = 10
oauth_allow_insecure_email_lookup = false
api_key_max_seconds_to_live = 86400

[auth.generic_oauth]
enabled = true
name = Codestra SSO
allow_sign_up = true
auto_login = true
client_id = grafana-observability
client_secret = $__file{/run/secrets/grafana_oidc_client_secret}
scopes = openid profile email
email_attribute_path = email
login_attribute_path = preferred_username
name_attribute_path = name
auth_url = https://auth.codestra.co/realms/codestra/protocol/openid-connect/auth
token_url = https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
api_url = https://auth.codestra.co/realms/codestra/protocol/openid-connect/userinfo
use_pkce = true
use_refresh_token = true
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = true
role_attribute_path = contains(realm_access.roles[*], 'observability-admin') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'observability-operator') && 'Editor' || contains(realm_access.roles[*], 'observability-viewer') && 'Viewer'

[auth.anonymous]
enabled = false

[security]
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
strict_transport_security_preload = true
strict_transport_security_subdomains = true
content_type_protection = true
x_content_type_options = true
x_xss_protection = true
content_security_policy = true
content_security_policy_template = """script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self' data:;style-src 'self' 'unsafe-inline' blob:;img-src 'self' data: blob:;base-uri 'self';connect-src 'self' ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';frame-ancestors 'none';form-action 'self' https://auth.codestra.co;"""
csrf_trusted_origins = graf.codestra.media auth.codestra.co
csrf_always_check = true

[snapshots]
enabled = false
external_enabled = false
public_mode = false

[dashboards]
versions_to_keep = 20
min_refresh_interval = 15s
default_home_dashboard_path = /etc/grafana/codestra-dashboards/executive/executive-platform.json

[explore]
enabled = true

[unified_alerting]
enabled = false

[alerting]
enabled = false

[metrics]
enabled = true
interval_seconds = 10
disable_total_stats = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[log]
mode = console
level = info
filters = rendering:warn oauth.generic_oauth:info

[log.console]
format = json

[feature_toggles]
enable = correlations traceToMetrics metricsSummary
